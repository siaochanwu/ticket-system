name: Ticket System CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: tickets
                    POSTGRES_USER: tickets
                    POSTGRES_PASSWORD: tickets
                ports:
                    - '5432:5432'
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7-alpine
                ports:
                    - '6379:6379'
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Generate Prisma Client
              run: npx prisma generate

            - name: Deploy Database Migrations
              run: npx prisma migrate deploy
              env:
                  DATABASE_URL: postgresql://tickets:tickets@localhost:5432/tickets?schema=public

            - name: Run Tests
              run: npm test
              env:
                  DATABASE_URL: postgresql://tickets:tickets@localhost:5432/tickets?schema=public
                  REDIS_URL: redis://localhost:6379
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
